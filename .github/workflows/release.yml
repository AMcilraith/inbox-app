name: Build & release

# Every push to main builds InboxHub.exe on Windows and publishes it as a new GitHub release.
# Pushing a tag like v1.0.0 publishes a release with that version instead.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build InboxHub.exe
        run: cargo build --release --locked

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $base = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" } else { $v = "v$base-build.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package the InboxHub folder
        shell: pwsh
        run: |
          $out = "InboxHub"
          New-Item -ItemType Directory -Force -Path "$out/config", "$out/data" | Out-Null
          Copy-Item target/release/InboxHub.exe "$out/InboxHub.exe"
          Copy-Item inbox-hub.example.toml "$out/config/inbox-hub.example.toml"
          Copy-Item README.md "$out/README.md"
          # Your own settings file (config/inbox-hub.toml) is created on first run and is never
          # part of a release, so unzipping an update over the folder keeps your settings.
          Set-Content -Path "$out/data/.keep" -Value "Sign-in tokens and logs are stored here."
          Compress-Archive -Path $out -DestinationPath "InboxHub-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InboxHub-${{ steps.version.outputs.version }}-windows-x64
          path: InboxHub/

      - name: Keep the zip for the release job
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: InboxHub-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Work out the version
        id: version
        run: |
          base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; else v="v$base-build.${{ github.run_number }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "name=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Tests and screenshots
        working-directory: android
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Upload phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: |
            android/app/build/screenshots/
            android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build APK
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "InboxHub-${{ steps.version.outputs.version }}-android.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InboxHub-${{ steps.version.outputs.version }}-android
          path: InboxHub-${{ steps.version.outputs.version }}-android.apk

      - name: Keep the APK for the release job
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: InboxHub-${{ steps.version.outputs.version }}-android.apk
          if-no-files-found: error

  # Publish once, after both builds succeed, so a release never appears with only one file
  # (the Android job finishes minutes before Windows) and never half-published if one fails.
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; else v="v$base-build.${{ github.run_number }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Fetch the Windows zip and Android APK
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Check both files are there
        run: |
          ls -l dist
          test -f "dist/InboxHub-${{ steps.version.outputs.version }}-windows-x64.zip"
          test -f "dist/InboxHub-${{ steps.version.outputs.version }}-android.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Inbox Hub ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          # A full release (not a pre-release), so it shows as "Latest" and
          # /releases/latest always points at the newest build.
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/InboxHub-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/InboxHub-${{ steps.version.outputs.version }}-android.apk
          body: |
            **Windows:** download `InboxHub-${{ steps.version.outputs.version }}-windows-x64.zip`, unzip it anywhere (e.g. `D:\InboxHub`) and double-click **InboxHub.exe**.

            **Android:** download `InboxHub-${{ steps.version.outputs.version }}-android.apk` on your phone and open it to install.

            ```
            InboxHub/
              InboxHub.exe        <- the app
              config/             <- settings (inbox-hub.toml is created on first run)
              data/               <- sign-in tokens and logs
              README.md
            ```

            Updating: unzip the new version over the old folder. Your settings and sign-in are kept.
