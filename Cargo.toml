[package]
name = "inbox-hub"
version = "0.2.0"
edition = "2021"
description = "One desktop app for all your email accounts, calendars and daily digests, with Claude built in"
build = "build.rs"

# One double-clickable program: InboxHub.exe
[[bin]]
name = "InboxHub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
jiff = "1.0.3"
directories = "5"
futures = "0.3"
html2text = "0.12"
open = "5"
rand = "0.8"
# native-tls uses Windows' own TLS (SChannel), so no C compiler is needed to build.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.8"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[build-dependencies]
slint-build = "1.8"
# Embeds assets/icon.ico into InboxHub.exe (only used when building for Windows).
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
